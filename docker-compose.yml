services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kakeibo
      POSTGRES_PASSWORD: kakeibo
      POSTGRES_DB: kakeibo_dev
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kakeibo -d kakeibo_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
