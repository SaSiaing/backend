# 팀 공통 Codex 실행 기본값. 프로젝트를 trusted로 열어야 적용됩니다.
# 제품·코드 규칙은 AGENTS.md, 커밋 강제는 .githooks/가 담당합니다.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[features]
hooks = true

[[hooks.SessionStart]]
matcher = "^startup$"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'root="$(git rev-parse --show-toplevel 2>/dev/null)" || { echo "Codex를 app 또는 backend 저장소 안에서 시작하세요." >&2; exit 1; }; sh "$root/.codex/guard-branch.sh"'
timeout = 5
statusMessage = "브랜치 확인"
